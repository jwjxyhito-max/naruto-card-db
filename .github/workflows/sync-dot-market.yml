name: Validate DOT market data
on:
  workflow_dispatch:
  push:
    paths:
      - "data/dot-market-input.json"
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and generate site market JSON
        run: node scripts/sync-dot-market.mjs
      - name: Commit validated data
        run: |
          git config user.name "naruto-card-db-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dot-market.json
          git diff --cached --quiet || git commit -m "Sync validated DOT market data"
          git push